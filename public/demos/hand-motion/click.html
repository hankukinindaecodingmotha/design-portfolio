<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICK — Hand Cursor Experiment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="click" data-experience="click" class="page-click">
  <div id="app">
    <section id="start-screen">
      <div class="card">
        <p class="eyebrow">CLICK · 손 커서 실험</p>
        <h1>손으로 마우스를 대신해 보세요</h1>
        <p class="desc">
          검지 끝이 커서가 되고, 엄지와 검지를 핀치하면 클릭됩니다.
          화면에 뜬 타겟을 조준해 클릭해보세요.
        </p>
        <button id="start-btn" type="button">카메라로 시작</button>
        <button id="demo-btn" type="button" class="demo-btn">데모 미리보기</button>
        <p id="error-msg" class="error" hidden></p>
      </div>
    </section>
    <section id="stage" hidden>
      <video id="camera" playsinline webkit-playsinline muted autoplay></video>
      <canvas id="visual-canvas"></canvas>
      <div id="hud">
        <span id="status">손을 보여주세요</span>
        <span id="hint">☝️ 검지 = 커서 · 🤏 핀치 = 클릭</span>
        <span id="mode-label">모드: 클릭</span>
        <p id="stage-error" class="stage-error" hidden></p>
      </div>
      <button id="stop-btn" type="button" title="종료">✕</button>
    </section>
  </div>

  <script>
    window.addEventListener("unhandledrejection", (e) => {
      const el = document.getElementById("error-msg");
      if (el) { el.hidden = false; el.textContent = "오류: " + (e.reason?.message || e.reason || "알 수 없는 오류"); }
    });
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        if (!window.__HAND_APP_READY__) {
          const err = document.getElementById("error-msg");
          if (err) { err.hidden = false; err.textContent = "앱 스크립트가 아직 준비되지 않았습니다. 새로고침 해주세요."; }
        }
      }, 5000);
    });
  </script>

  <script type="module" src="pages-nav.js"></script>
  <script type="module" src="click.js?v=20260906cosmos2"></script>
</body>
</html>
