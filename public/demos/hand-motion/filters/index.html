<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAMERA TOUCH — AR Filters</title>
  <link rel="stylesheet" href="filters.css">
</head>
<body data-page="filters">
  <main class="filter-stage">
    <video id="filter-video" playsinline muted autoplay></video>
    <canvas id="filter-canvas"></canvas>
    <div class="filter-vignette"></div>
    <header><i></i><strong>CAMERA TOUCH</strong><small>GESTURE FILTER LAB / 05</small></header>
    <section class="filter-status"><span id="filter-index">FILTER 00</span><h1 id="filter-name">CAMERA READY</h1><p id="gesture-status">눈 깜빡임 = 다음 필터 · 글리치에서 엄지·검지 터치 = 게이트 효과 변경</p></section>
    <aside class="filter-guide"><b>CONTROL MAP</b><p><strong>CAMERA</strong><span>오른쪽 아래 버튼으로 켜기·끄기</span></p><p><strong>BLINK</strong><span>눈 깜빡이면 다음 필터</span></p><p><strong>GATE</strong><span>양손 엄지·검지 사이 공간에 효과</span></p><p><strong>PINCH</strong><span>글리치에서 엄지·검지 닿으면 게이트 효과 순환</span></p><p><strong>2F → 2O</strong><span>양손 쥐었다 펴면 다음 필터</span></p></aside>
    <button id="camera-toggle" type="button" aria-pressed="false">카메라 켜기</button>
    <p class="filter-error" id="filter-error"></p>
  </main>
  <script type="module" src="../pages-nav.js"></script>
  <script type="module" src="filters.js"></script>
</body>
</html>
